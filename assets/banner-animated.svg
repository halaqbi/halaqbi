<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Haneen Alaqbi</title>
  <desc id="desc">Learning today, building tomorrow. An animated blue and violet banner with a floating code window, typing text, and drifting stars.</desc>
  <style>
    .window { animation: float 5s ease-in-out infinite; }
    .typing { animation: type 8s steps(21, end) infinite; }
    .cursor { animation: blink 1s steps(2, start) infinite; }
    .stars { animation: drift 7s ease-in-out infinite; }
    .stars-slow { animation: drift 9s ease-in-out infinite reverse; }
    .signal { animation: travel 6s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    @keyframes type { 0%,8% { width: 0px; } 52%,88% { width: 270px; } 100% { width: 0px; } }
    @keyframes blink { to { opacity: 0; } }
    @keyframes drift { 0%,100% { transform: translate(0,0); opacity: .35; } 50% { transform: translate(14px,-16px); opacity: .85; } }
    @keyframes travel { 0% { transform: translateX(0); opacity: 0; } 12%,88% { opacity: 1; } 100% { transform: translateX(1040px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .window, .typing, .cursor, .stars, .stars-slow, .signal { animation: none; }
    }
  </style>
  <defs>
    <clipPath id="typed"><rect class="typing" x="48" y="110" width="270" height="30"/></clipPath>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#0b1225"/>
      <stop offset="1" stop-color="#231743"/>
    </linearGradient>
    <linearGradient id="accent">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#a5b4fc" stroke-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="1130" cy="35" r="180" fill="#8b5cf6" opacity=".07"/>
  <circle cx="25" cy="355" r="160" fill="#38bdf8" opacity=".05"/>
  <g class="stars" fill="#7dd3fc">
    <circle cx="694" cy="72" r="3"/><circle cx="740" cy="269" r="2"/>
    <path d="M1153 164v12m-6-6h12" stroke="#7dd3fc" stroke-width="2"/>
    <circle cx="581" cy="42" r="2"/>
  </g>
  <g class="stars-slow" fill="#c4b5fd">
    <path d="M700 196v12m-6-6h12" stroke="#c4b5fd" stroke-width="2"/>
    <circle cx="1052" cy="310" r="3"/><circle cx="1160" cy="61" r="2"/>
  </g>
  <rect x="64" y="65" width="48" height="4" rx="2" fill="url(#accent)"/>
  <text x="64" y="109" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="4" fill="#7dd3fc">HELLO, WORLD</text>
  <text x="60" y="179" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="700" fill="#f1f5f9">Haneen Alaqbi</text>
  <text x="64" y="224" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#c4b5fd">Learning today, building tomorrow.</text>
  <text x="64" y="279" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="2" fill="#94a3b8">WEB DEVELOPMENT  /  CURIOSITY  /  PROGRESS</text>
  <g transform="translate(785 78)">
  <g class="window">
    <rect width="340" height="204" rx="16" fill="#0d1427" stroke="#475569" stroke-opacity=".5"/>
    <path d="M0 42H340" stroke="#26324b"/>
    <circle cx="23" cy="22" r="5" fill="#fb7185"/>
    <circle cx="41" cy="22" r="5" fill="#fbbf24"/>
    <circle cx="59" cy="22" r="5" fill="#34d399"/>
    <text x="26" y="94" font-family="monospace" font-size="24" fill="#7dd3fc">&lt;hello&gt;</text>
    <text clip-path="url(#typed)" x="50" y="132" font-family="monospace" font-size="20" fill="#e2e8f0">learn. build. repeat.</text>
    <text x="26" y="170" font-family="monospace" font-size="24" fill="#c4b5fd">&lt;/hello&gt;</text>
    <rect class="cursor" x="149" y="150" width="10" height="23" rx="1" fill="#7dd3fc"/>
  </g>
  </g>
  <rect x="64" y="330" width="1072" height="2" rx="1" fill="url(#accent)" opacity=".6"/>
  <rect class="signal" x="64" y="328" width="32" height="6" rx="3" fill="#7dd3fc"/>
</svg>
