  <text x="60" y="179" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="700" fill="#f1f5f9">Haneen Alaqbi</text>
  <text x="64" y="224" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#c4b5fd">Learning today, building tomorrow.</text>
  <text x="64" y="279" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="2" fill="#94a3b8">WEB DEVELOPMENT  /  CURIOSITY  /  PROGRESS</text>
  <g transform="translate(785 78)">
