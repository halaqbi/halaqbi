    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#a5b4fc" stroke-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
