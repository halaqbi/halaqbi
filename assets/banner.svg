<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Haneen Alaqbi</title>
  <desc id="desc">Learning today, building tomorrow. A blue and violet banner with a decorative code window.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#0b1225"/>
      <stop offset="1" stop-color="#231743"/>
    </linearGradient>
    <linearGradient id="accent">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#c4b5fd"/>
